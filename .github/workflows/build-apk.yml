name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Configure explicit debug signing
        run: |
          python3 - << 'EOF'
          path = "android/app/build.gradle"
          with open(path) as f:
              content = f.read()

          signing_block = '''    signingConfigs {
              debug {
                  storeFile file('../../debug.keystore')
                  storePassword 'android'
                  keyAlias 'androiddebugkey'
                  keyPassword 'android'
              }
          }
          '''

          content = content.replace(
              "    buildTypes {\n",
              signing_block + "    buildTypes {\n        debug {\n            signingConfig signingConfigs.debug\n        }\n",
              1,
          )

          with open(path, "w") as f:
              f.write(content)

          print("=== build.gradle aggiornato ===")
          print(content)
          EOF

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set version (aggiorna invece di reinstallare)
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build APK
        run: cd android && ./gradlew assembleDebug

      - name: Verify APK signature (diagnostica)
        run: |
          echo "=== IMPRONTA DELLA FIRMA SULL'APK FINALE ==="
          APKSIGNER=$(find $ANDROID_HOME -name "apksigner" | head -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk || echo "apksigner non trovato o verifica fallita"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mitologia-greca-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
